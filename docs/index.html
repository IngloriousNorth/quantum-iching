      font-weight: bold;

      padding: 0.8rem;
      border: none;
      border-radius: 6px;

      justify-content: space-around;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem 0;

      text-align: center;
      flex: 1;
      min-width: 220px;

      width: 180px;
      margin: 1rem auto;
    }
    .line-row {
      height: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .line-solid {
      background-color: var(--accent);
      width: 100%;
      height: 100%;
      border-radius: 2px;
    }
    .line-broken {
      display: flex;
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }
    .line-broken span {
      background-color: var(--accent);
      width: 45%;
      height: 100%;
      border-radius: 2px;
    }
    .changing .line-solid, 
    .changing .line-broken span {
      background-color: var(--changing) !important;
    }
    
    .poetic-text {
      font-style: italic;
      white-space: pre-wrap;
      line-height: 1.6;
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1rem 0;

    .original-top-box {

      border-left: 3px solid var(--accent);
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 0 6px 6px 0;

      border-radius: 0 6px 6px 0;

      margin-bottom: 0.25rem;

function getTrigramTitle(binaryKey) {
  if (!binaryKey || binaryKey.length !== 6) return "Trigram Dynamics";
  const lower = binaryKey.substring(0, 3);
  const upper = binaryKey.substring(3, 6);
  const lowerName = TRIGRAM_NAMES[lower] || "Unknown";
  const upperName = TRIGRAM_NAMES[upper] || "Unknown";
  return `${upperName} over ${lowerName}`;
}

function getHexagramDetails(num) {
  if (HEXAGRAM_DATA[num]) {
    return HEXAGRAM_DATA[num];
  }
  return {
    name: `Hexagram ${num}`,
    title: `King Wen Number ${num}`,
    judgment: `Hexagram ${num}: Firmness and correctness bring good fortune in this state.`,
    verse: `Hexagram ${num}: The forces realign to establish balance and order.`,
    lines: {
      1: { title: "Line 1", text: `Hexagram ${num}, Line 1: Firmness in the initial stage.` },
      2: { title: "Line 2", text: `Hexagram ${num}, Line 2: Central position maintained.` },
      3: { title: "Line 3", text: `Hexagram ${num}, Line 3: Active transition requires care.` },
      4: { title: "Line 4", text: `Hexagram ${num}, Line 4: Proper positioning brings success.` },
      5: { title: "Line 5", text: `Hexagram ${num}, Line 5: Supreme authority exercised correctly.` },
      6: { title: "Line 6", text: `Hexagram ${num}, Line 6: Caution at the culmination.` }
    }
  };
}

function numberToLeggeToss(num) {
  if (num <= 31) return 6;       // 1/8 chance (3 Tails -> Old Yin)
  if (num <= 127) return 7;      // 3/8 chance (2 Tails, 1 Head -> Young Yang)
  if (num <= 223) return 8;      // 3/8 chance (1 Tail, 2 Heads -> Young Yin)
  return 9;                      // 1/8 chance (3 Heads -> Old Yang)
}

async function fetchQuantumNumber() {
  const response = await fetch(PROXY_URL);
  if (!response.ok) throw new Error("Quantum API network error");
  const json = await response.json();
  const val = json.data ? json.data.number : json.number;
  if (val === undefined || val === null) throw new Error("Invalid payload format");
  return Number(val);
}

function renderVisualHexagram(lines, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  
  lines.forEach((line) => {
    const row = document.createElement('div');
    row.className = `line-row ${line.isChanging ? 'changing' : ''}`;
    
    if (line.value === 1) {
      row.innerHTML = `<div class="line-solid"></div>`;
    } else {
      row.innerHTML = `<div class="line-broken"><span></span><span></span></div>`;
    }
    container.appendChild(row);
  });
}

async function performDivination() {
  const statusEl = document.getElementById('status');
  const castBtn = document.getElementById('castBtn');
  castBtn.disabled = true;

  const tosses = [];
  const quantumValues = [];

  try {
    for (let line = 1; line <= 6; line++) {
      statusEl.innerText = `Consulting Quantum Oracle for Line ${line} of 6...`;
      
      let num;
      try {
        num = await fetchQuantumNumber();
      } catch (err) {
        const randArr = new Uint8Array(1);
        window.crypto.getRandomValues(randArr);
        num = randArr[0];
      }

      const toss = numberToLeggeToss(num);
      tosses.push(toss);
      quantumValues.push(num);
    }

    statusEl.innerText = "Processing Quantum State...";
    runDivination(tosses, quantumValues);

  } catch (error) {
    statusEl.innerText = "Error reading quantum entropy. Try again.";
    castBtn.disabled = false;
  }
}

function runDivination(tosses, quantumValues) {
  const primaryLines = [];
  const transformedLines = [];
  const changingLineIndices = [];

  tosses.forEach((toss, idx) => {
    const isPrimaryYang = (toss === 7 || toss === 9) ? 1 : 0;
    const isChanging = (toss === 6 || toss === 9);
    
    let isTransformedYang = isPrimaryYang;
    if (isChanging) {
      isTransformedYang = isPrimaryYang === 1 ? 0 : 1;
      changingLineIndices.push({ 
        lineNumber: idx + 1, 
        tossType: toss === 6 ? "Old Yin (6 → 7 [Yang])" : "Old Yang (9 → 8 [Yin])" 
      });
    }

    primaryLines.push({ value: isPrimaryYang, isChanging, toss });
    transformedLines.push({ value: isTransformedYang, isChanging });
  });

  const pBin = primaryLines.map(l => l.value).join('');
  const sBin = transformedLines.map(l => l.value).join('');

  const pNum = KING_WEN_LOOKUP[pBin] || 1;
  const sNum = KING_WEN_LOOKUP[sBin] || 1;

  const pTrigramTitle = getTrigramTitle(pBin);
  const sTrigramTitle = getTrigramTitle(sBin);

  const pData = getHexagramDetails(pNum);
  const sData = getHexagramDetails(sNum);

  renderVisualHexagram(primaryLines, 'pVisual');
  
  document.getElementById('pTitle').innerText = `Hexagram ${pNum}: ${pData.name}`;
  document.getElementById('pKeywords').innerText = `${pData.title}\n[${pTrigramTitle}]`;
  document.getElementById('pOriginalJudgment').innerText = `"${pData.judgment}"`;
  document.getElementById('pVerse').innerText = pData.verse;

  const changingContainer = document.getElementById('changingContainer');
  const changingList = document.getElementById('changingList');
  const sBox = document.getElementById('sBox');
  const transformedVerseContainer = document.getElementById('transformedVerseContainer');
  const sFullText = document.getElementById('sFullText');

  if (changingLineIndices.length > 0) {
    changingList.innerHTML = changingLineIndices.map(item => {
      const lineDetails = pData.lines[item.lineNumber] || { title: `Line ${item.lineNumber}`, text: `Line ${item.lineNumber} active` };
      return `<div class="changing-line-item">
        <span class="changing-badge">Line ${item.lineNumber} Active (${item.tossType})</span><br>
        <span class="line-title">${lineDetails.title}</span>
        <div class="changing-line-text">"${lineDetails.text}"</div>
      </div>`;
    }).join('');

    changingContainer.style.display = 'block';

    renderVisualHexagram(transformedLines, 'sVisual');
    document.getElementById('sTitle').innerText = `Transformed: ${sNum} (${sData.name})`;
    document.getElementById('sKeywords').innerText = `${sData.title}\n[${sTrigramTitle}]`;
    document.getElementById('sVerse').innerText = sData.verse;

    // Direct verbatim Transformed Hexagram Judgment and its own 6 lines
    let fullTextHtml = `<div style="margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">
      <strong style="color: var(--accent);">Transformed Judgment:</strong><br>
      <em>"${sData.judgment}"</em>
    </div>`;

    for (let i = 1; i <= 6; i++) {
      const sLineDetails = sData.lines[i] || { title: `Line ${i}`, text: `Line ${i} of Transformed Hexagram` };
      fullTextHtml += `<div style="margin-bottom: 0.5rem;">
        <strong style="color: var(--accent);">${sLineDetails.title}:</strong> 
        <span>"${sLineDetails.text}"</span>
      </div>`;
    }
    sFullText.innerHTML = fullTextHtml;
    
    sBox.style.display = 'block';
    transformedVerseContainer.style.display = 'block';
  } else {
    changingContainer.style.display = 'none';
    sBox.style.display = 'none';
    transformedVerseContainer.style.display = 'none';
  }

  const metaText = `Quantum Numbers (Lines 1-6): [${quantumValues.join(', ')}]<br>Coin Toss Values: [${tosses.join(', ')}]`;
  document.getElementById('drandMeta').innerHTML = `<b>Entropy Source:</b><br>${metaText}`;
  document.getElementById('result').style.display = 'block';
  document.getElementById('status').innerText = "";
  document.getElementById('castBtn').disabled = false;
}

document.getElementById('castBtn').addEventListener('click', performDivination);
